              <article

                <header className="entry-header">
                  <div className="inner-wrap">
                    <h1 className="entry-title">Pyon Moo Do Kids Videos</h1>
                  </div>
                  {/* .inner-wrap */}
                </header>
                {/* .entry-header */}
                <div className="entry-content">
                  <p>
                    Here is a collection of demonstration and instructional
                    videos for former students and staff.
                  </p>
                  <p>
                    <strong>Videos For Parents</strong>
                  </p>
                  <p>
                    <a href="https://www.youtube.com/watch?v=2mtXrdN3IsY&list=PLS8wvzjuJjSCyJYyMlzRIaqyS7TWhT1PP&index=17">
                      Life Skills Stripes
                    </a>{" "}
                    (Home, School &amp; Community Service) <br />
                    <a href="https://www.youtube.com/watch?v=IxIPxn-Km8k&list=PLS8wvzjuJjSCyJYyMlzRIaqyS7TWhT1PP&index=12">
                      Service Stripes <br />
                    </a>
                    <a href="https://www.youtube.com/watch?v=IonEc6JCrr0&list=PLS8wvzjuJjSCyJYyMlzRIaqyS7TWhT1PP&index=23">
                      Helping your child with burnout{" "}
                    </a>
                    <br />
                    <a href="https://www.youtube.com/watch?v=IX9EzjWP5hE&list=PLS8wvzjuJjSCyJYyMlzRIaqyS7TWhT1PP&index=20">
                      Supporting your child returning after a long break
                    </a>
                    <br />
                    <a
                      rel="noreferrer noopener"
                      aria-label="How to fold your Dobok (Uniform) (opens in a new tab)"
                      href="https://www.youtube.com/watch?v=BkyJxQ_kWgI"
                      target="_blank"
                    >
                      How to fold your Dobok (Uniform)
                    </a>{" "}
                    <br />
                    <a
                      href="https://www.youtube.com/watch?v=DinpvZ89_Zs"
                      target="_blank"
                      rel="noreferrer noopener"
                      aria-label="How to tie your belt (opens in a new tab)"
                    >
                      How to tie your belt
                    </a>{" "}
                  </p>
                  <p>
                    <strong>Belt Tests</strong>
                  </p>
                  <p>
                    <a href="https://www.youtube.com/watch?v=vRuSniPH4J8">
                      Hwarang Club, 6/6/2019
                    </a>
                  </p>
                  <p>
                    <strong>Pyon Moo Do Kids Curriculum</strong>
                  </p>
                  <p>
                    We didn’t get everything filmed before closing, so there are
                    some missing elements below.
                  </p>
                  <p>
                    For other material outside of the standard curriculum check
                    out our,&nbsp;Archive of Extra-Curricular Material&nbsp;on
                    the Pyon Moo Do adult curriculum page.
                  </p>
                  <p>
                    <strong>Beginner Program</strong>
                  </p>
                  <p>
                    This is where kids learned the fundamentals. Students would
                    typically spend 6-18 months at this level learning not only
                    the fundamentals of martial arts movement and technique, but
                    also the culture of the Dojang and how to learn in that
                    environment.
                  </p>
                  <p>
                    <strong>White Belt</strong>
                  </p>
                  <p>
                    <a
                      rel="noreferrer noopener"
                      href="https://youtu.be/3TOhCfmJt5M"
                      target="_blank"
                    >
                      Kwan Bup
                    </a>{" "}
                    <br />
                    <a
                      rel="noreferrer noopener"
                      href="https://www.youtube.com/watch?v=AqEKY_jRPDY"
                      target="_blank"
                    >
                      Kicking Test
                    </a>
                    <br />
                    <a
                      rel="noreferrer noopener"
                      href="https://youtu.be/0K1J-YfoGT8"
                      target="_blank"
                    >
                      10-Step Movement
                    </a>
                    <br />
